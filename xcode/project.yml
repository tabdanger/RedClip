# The Xcode project GitHub builds Red Clip from (app + AUv3 effect plug-in). Generated on the
# build machine by xcode/generate.py and XcodeGen; nothing here is edited by hand on an iPad.
#
# Both targets build from copies generate.py makes of RedClip.swiftpm (the only original, the
# same files Swift Playgrounds runs): xcode/build/app has every Swift file and the resources;
# xcode/build/plugin has the faceplate + DSP files (no app entry point, transport or sample
# library), and the plug-in adds AUv3/*.swift. (XcodeGen mixes up folders that are nested in,
# or shared with, another source folder, so each target gets its own.)
name: RedClip
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RedClip:
    type: application
    platform: iOS
    sources:
      - path: build/app/Sources
      - path: build/app/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "Red Clip"
        PRODUCT_BUNDLE_IDENTIFIER: com.tabdanger.redclip
        PRODUCT_MODULE_NAME: RedClip
        INFOPLIST_FILE: build/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: __PresetAccentColor
        # iPad only, like Package.swift (XcodeGen's iOS preset would add iPhone at target level).
        TARGETED_DEVICE_FAMILY: "2"
    dependencies:
      - target: RedClipAU
        embed: true
        codeSign: true
  RedClipAU:
    type: app-extension
    platform: iOS
    sources:
      - path: build/plugin/Sources
      - path: ../AUv3
        includes: ["*.swift"]
      - path: build/plugin/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: RedClipAU
        PRODUCT_MODULE_NAME: RedClipAU
        PRODUCT_BUNDLE_IDENTIFIER: com.tabdanger.redclip.AUv3
        INFOPLIST_FILE: build/AU-Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: __PresetAccentColor
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) REDCLIP_PLUGIN"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  RedClip:
    build:
      targets:
        RedClip: all
        RedClipAU: all
    archive:
      config: Release
